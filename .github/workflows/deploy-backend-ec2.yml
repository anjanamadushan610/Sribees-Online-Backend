# =============================================================================
# SRIBEESonline — AWS EC2 Backend CI/CD Pipeline (Zero-Manual-Setup)
#
# Triggers on push to the 'main' branch of the standalone Backend repository.
#
# Images are published to the GitHub Container Registry (ghcr.io) using the
# automatic GITHUB_TOKEN — no registry account or registry secret is required.
#
# Required GitHub Secrets:
#   EC2_HOST            — EC2 Public IP or Domain
#   EC2_USERNAME        — SSH username (e.g. ubuntu)
#   EC2_SSH_KEY         — SSH Private Key (PEM format)
#   ENV_CONTENT         — Full consolidated .env file contents
# =============================================================================

name: Build & Deploy Backend (Zero-Manual-Setup)

on:
  push:
    branches: [ main ]
  # Allows a redeploy to be triggered from the Actions tab. Without this the
  # only way to re-run a deploy is to invent a commit.
  workflow_dispatch:

env:
  # ghcr.io path is derived from the repo itself: ghcr.io/<owner>/<repo>.
  # GHCR rejects uppercase, so the owner/repo must stay lowercase.
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The whole CI gate (deploy.yml), as a prerequisite. Nothing is built, pushed
  # or deployed unless lint, the security scans, every test suite and the
  # deploy rehearsal pass. Until 2026-09-25 this workflow and CI ran side by
  # side, so a red CI never stopped a production deploy.
  ci:
    name: CI gate
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    outputs:
      compose_b64: ${{ steps.encode.outputs.compose_b64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Encode compose template as base64
        id: encode
        run: |
          # Base64 encode the EC2 compose template (avoids heredoc issues over SSH)
          COMPOSE_B64=$(base64 -w 0 docker/ec2-docker-compose.yml)
          echo "compose_b64=$COMPOSE_B64" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMPOSE_B64: ${{ needs.build-and-push.outputs.compose_b64 }}
          ENV_CONTENT: ${{ secrets.ENV_CONTENT }}
          # GITHUB_TOKEN is scoped to this run and expires when it ends, so the
          # EC2 host only holds a valid credential for the length of the deploy.
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_IMAGE: ghcr.io/${{ github.repository }}
          # Layered on top of ENV_CONTENT (see step 4b below) instead of living
          # inside that single consolidated blob -- lets the Marx production
          # key be rotated/set on its own, without anyone needing to view or
          # reconstruct the full ENV_CONTENT text (GitHub secrets are
          # write-only once saved). Either may be left unset; step 4b no-ops
          # for whichever one is empty.
          MARX_IPG_API_KEY: ${{ secrets.MARX_IPG_API_KEY }}
          MARX_IPG_BASE_URL: ${{ secrets.MARX_IPG_BASE_URL }}
          MARX_IPG_RETURN_URL: ${{ secrets.MARX_IPG_RETURN_URL }}
          MARX_GATEWAY_METHODS_ENABLED: ${{ secrets.MARX_GATEWAY_METHODS_ENABLED }}
          # The Firebase service-account JSON (Firebase console > Project
          # settings > Service accounts > Generate new private key), pasted
          # as-is. Without it the backend starts with FCM disabled and no push
          # notification ever leaves the server -- which is what production
          # did until this was added.
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          # Comma-separated phone numbers (testers, store-review demo accounts)
          # that may sign in with the test OTP. Unset = nobody can (SEC-001).
          OTP_TEST_PHONES: ${{ secrets.OTP_TEST_PHONES }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: COMPOSE_B64,ENV_CONTENT,REGISTRY_USERNAME,REGISTRY_TOKEN,DOCKER_IMAGE,MARX_IPG_API_KEY,MARX_IPG_BASE_URL,MARX_IPG_RETURN_URL,MARX_GATEWAY_METHODS_ENABLED,FIREBASE_CREDENTIALS_JSON,OTP_TEST_PHONES
          # MUST stay false. script_stop makes the action test every command's
          # exit status itself and return on the first non-zero one. That check
          # sits outside bash, so it ignores `set +e` AND the rule that a
          # command may fail harmlessly as an `if` condition — so every
          # `if some-probe; then ... else ... fi` below aborts the deploy the
          # moment the probe answers "no". The script sets -euo pipefail itself,
          # which stops on real errors while letting conditionals work.
          script_stop: false
          script: |
            set -euo pipefail

            echo "==== 1. UPDATE & INSTALL CORE DEPENDENCIES ===="
            # Wait for dpkg/apt lock to be released by retrying apt-get update
            LOCK_ACQUIRED=0
            for i in $(seq 1 30); do
              if sudo apt-get update -y >/dev/null 2>&1; then
                LOCK_ACQUIRED=1
                break
              fi
              echo "Apt lock is held or network is busy. Waiting for lock release ($i/30)..."
              sleep 10
            done
            if [ "$LOCK_ACQUIRED" -ne 1 ]; then
              echo "ERROR: Could not acquire apt lock after 5 minutes."
              exit 1
            fi
            sudo apt-get install -y curl git gnupg lsb-release certbot python3-certbot-nginx nginx

            echo "==== 2. INSTALL DOCKER (if missing) ===="

            # `command -v` not `which`: newer Ubuntu releases dropped the which
            # binary from debianutils, so `which docker` can exit 127. command -v
            # is a POSIX shell builtin and is always present.
            if command -v docker >/dev/null 2>&1; then
              echo "Docker already installed."
            else
              echo "Installing Docker..."
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
              sudo systemctl start docker
              sudo systemctl enable docker
              # id -un rather than "$USER": set -u aborts on an unset USER, and
              # a non-login SSH shell does not always export it.
              sudo usermod -aG docker "$(id -un)"
              echo "Docker installed!"
            fi

            if sudo docker compose version >/dev/null 2>&1; then
              echo "Docker compose already installed."
            else
              sudo apt-get install -y docker-compose-plugin
            fi

            echo "==== 3. CREATE DEPLOYMENT DIRECTORY ===="
            DEPLOY_DIR="$HOME/sribees-backend"
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown -R "$(id -un):$(id -gn)" "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "==== 4. WRITE .env FILE ===="
            printf '%s' "$ENV_CONTENT" > .env
            chmod 600 .env

            echo "==== 4b. LAYER STANDALONE SECRETS ONTO .env ===="
            # MARX_IPG_API_KEY / MARX_IPG_BASE_URL are set as their own GitHub
            # secrets rather than living inside the single ENV_CONTENT blob --
            # replaces the line if ENV_CONTENT already defines it, appends
            # otherwise. Each is independently optional: an unset secret
            # leaves whatever (if anything) ENV_CONTENT already had untouched.
            if [ -n "${MARX_IPG_API_KEY:-}" ]; then
              grep -v '^MARX_IPG_API_KEY=' .env > .env.tmp || true
              mv .env.tmp .env
              echo "MARX_IPG_API_KEY=${MARX_IPG_API_KEY}" >> .env
            fi
            if [ -n "${MARX_IPG_BASE_URL:-}" ]; then
              grep -v '^MARX_IPG_BASE_URL=' .env > .env.tmp || true
              mv .env.tmp .env
              echo "MARX_IPG_BASE_URL=${MARX_IPG_BASE_URL}" >> .env
            fi
            if [ -n "${MARX_IPG_RETURN_URL:-}" ]; then
              grep -v '^MARX_IPG_RETURN_URL=' .env > .env.tmp || true
              mv .env.tmp .env
              echo "MARX_IPG_RETURN_URL=${MARX_IPG_RETURN_URL}" >> .env
            fi
            if [ -n "${MARX_GATEWAY_METHODS_ENABLED:-}" ]; then
              grep -v '^MARX_GATEWAY_METHODS_ENABLED=' .env > .env.tmp || true
              mv .env.tmp .env
              echo "MARX_GATEWAY_METHODS_ENABLED=${MARX_GATEWAY_METHODS_ENABLED}" >> .env
            fi
            if [ -n "${OTP_TEST_PHONES:-}" ]; then
              grep -v '^OTP_TEST_PHONES=' .env > .env.tmp || true
              mv .env.tmp .env
              echo "OTP_TEST_PHONES=${OTP_TEST_PHONES}" >> .env
            fi
            # Push notifications. The pasted JSON spans many lines; compose's
            # env_file wants one, so it is compacted (and validated) first.
            # Never echoed.
            if [ -n "${FIREBASE_CREDENTIALS_JSON:-}" ]; then
              FIREBASE_ONE_LINE=$(printf '%s' "$FIREBASE_CREDENTIALS_JSON" | python3 -c 'import json, sys; print(json.dumps(json.load(sys.stdin), separators=(",", ":")))')
              grep -v '^FIREBASE_CREDENTIALS_JSON=' .env > .env.tmp || true
              mv .env.tmp .env
              echo "FIREBASE_CREDENTIALS_JSON=${FIREBASE_ONE_LINE}" >> .env
              unset FIREBASE_ONE_LINE
            elif ! grep -qE '^FIREBASE_CREDENTIALS_(JSON|PATH)=' .env; then
              echo "WARNING: no FIREBASE_CREDENTIALS_JSON secret -- push notifications stay OFF in production."
            fi
            chmod 600 .env

            # Extract domain and email safely (defaults if not found)
            DOMAIN=$(grep -m1 "^HOST_DOMAIN=" .env 2>/dev/null | cut -d'=' -f2- || true)
            DOMAIN="${DOMAIN:-api.sribeesonline.lk}"
            # Strip comments, spaces, protocol (http/https), and trailing slashes
            DOMAIN=$(echo "$DOMAIN" | cut -d'#' -f1 | sed -e 's|^[^/]*//||' -e 's|/.*$||' | tr -d '[:space:]')

            EMAIL=$(grep -m1 "^SSL_EMAIL=" .env 2>/dev/null | cut -d'=' -f2- || true)
            EMAIL="${EMAIL:-admin@sribeesonline.lk}"
            # Strip inline comments and spaces
            EMAIL=$(echo "$EMAIL" | cut -d'#' -f1 | tr -d '[:space:]')

            echo "Domain: $DOMAIN | Email: $EMAIL"

            echo "==== 5. WRITE docker-compose.yml (from base64 template) ===="
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
            sed -i "s|__DOCKER_IMAGE__|${DOCKER_IMAGE}:latest|g" docker-compose.yml
            echo "docker-compose.yml written. Validating..."
            sudo docker compose config --quiet && echo "YAML valid!" || { echo "YAML invalid!"; cat docker-compose.yml; exit 1; }

            echo "==== 5b. FREE DISK SPACE ===="
            # Every release pulls a new ~1 GB image and nothing ever removed
            # the old ones, until the root disk filled and the pull died with
            # "no space left on device" (2026-09-25, three deploys in a row).
            # Only images NO container uses are removed: the running app's
            # image, Postgres and Redis are all in use and stay, so the site
            # keeps serving and a failed pull still leaves it running.
            df -h / | tail -1
            sudo docker image prune -af >/dev/null || true
            sudo docker builder prune -af >/dev/null 2>&1 || true
            df -h / | tail -1
            AVAIL_KB=$(df --output=avail / | tail -1 | tr -d ' ')
            if [ "${AVAIL_KB:-0}" -lt 2097152 ]; then
              echo "ERROR: less than 2 GB free on / even after pruning images -- not pulling."
              sudo du -xh --max-depth=2 /var/lib/docker 2>/dev/null | sort -h | tail -10 || true
              exit 1
            fi

            echo "==== 6. LOGIN & PULL DOCKER IMAGES ===="
            echo "$REGISTRY_TOKEN" | sudo docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
            sudo docker compose pull fastapi_backend
            # Drop the short-lived credential rather than leaving it in
            # /root/.docker/config.json between deploys.
            sudo docker logout ghcr.io >/dev/null 2>&1 || true

            echo "==== 7. DEPLOY SERVICES ===="
            sudo docker compose down --remove-orphans 2>/dev/null || true
            sudo docker compose up -d postgres_db redis_cache

            # Resolve DB credentials from .env, falling back to the compose defaults.
            # `|| true` guards against `set -e`: grep exits 1 when the key is
            # absent (the compose hardcodes these), which would otherwise abort.
            DB_USER=$(grep -m1 '^POSTGRES_USER=' .env 2>/dev/null | cut -d '=' -f2- | cut -d '#' -f1 | tr -d '[:space:]' || true)
            DB_USER="${DB_USER:-sribees_user}"
            DB_NAME=$(grep -m1 '^POSTGRES_DB=' .env 2>/dev/null | cut -d '=' -f2- | cut -d '#' -f1 | tr -d '[:space:]' || true)
            DB_NAME="${DB_NAME:-sribeesonline}"

            echo "Waiting for Postgres ($DB_USER/$DB_NAME) to accept connections..."
            DB_READY=0
            for i in $(seq 1 30); do
              if sudo docker compose exec -T postgres_db pg_isready -U "$DB_USER" -d "$DB_NAME" >/dev/null 2>&1; then
                DB_READY=1
                echo "Postgres is ready."
                break
              fi
              echo "  ...waiting for Postgres ($i/30)"
              sleep 2
            done
            if [ "$DB_READY" -ne 1 ]; then
              echo "ERROR: Postgres is unreachable after 60s — aborting deploy."
              sudo docker compose logs --tail 50 postgres_db || true
              exit 1
            fi

            # Boot the app once so SQLAlchemy create_all() can create any MISSING
            # TABLES -- the raw SQL migrations only ALTER tables, so the tables
            # have to exist first.
            #
            # This boot is ALLOWED TO FAIL, and that is the whole point. A
            # release that adds a column starts an image whose ORM selects that
            # column, against a database where the migration adding it has not
            # run yet; startup queries the table, the column is missing, and the
            # app exits. That is not a broken release -- it is the ordering
            # doing what it always does, and the deploy recovers from it below
            # by running the migrations and restarting.
            #
            # It took production down once (2026-09-12) because the migrations
            # were copied out of the RUNNING container: the app could not start
            # without the migration, and the migration could not be reached
            # without the app. Hence the extraction from the image below.
            echo "Booting the application once (creates any missing base tables)..."
            sudo docker compose up -d fastapi_backend

            echo "Giving it a moment to run create_all()..."
            APP_READY=0
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
                APP_READY=1
                echo "Application is healthy on the first boot."
                break
              fi
              sleep 3
            done
            if [ "$APP_READY" -ne 1 ]; then
              echo "First boot did not report healthy -- expected when this release"
              echo "adds a column. Migrations run next, then the app is restarted."
            fi

            echo "==== 7b. RUN SQL MIGRATIONS (idempotent, in filename order) ===="
            # Taken from the IMAGE, not from a running container. The container
            # may legitimately be dead at this point (see above), and the
            # migrations are exactly what would revive it -- reaching them
            # through it would be circular.
            rm -rf ./migrations
            MIG_CID=$(sudo docker create "${DOCKER_IMAGE}:latest")
            sudo docker cp "${MIG_CID}:/app/migrations" ./migrations
            sudo docker rm -f "${MIG_CID}" >/dev/null 2>&1 || true
            sudo chown -R "$(id -un)":"$(id -gn)" ./migrations 2>/dev/null || true

            if ls ./migrations/*.sql >/dev/null 2>&1; then
              for f in $(ls -1 ./migrations/*.sql | sort); do
                echo ">>> Applying migration: $(basename "$f")"
                # ON_ERROR_STOP=1 makes psql exit non-zero on a genuine SQL error
                # or an unreachable DB (which aborts the deploy), while harmless
                # NOTICEs from IF NOT EXISTS clauses do NOT stop execution.
                if cat "$f" | sudo docker compose exec -T postgres_db \
                     psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME"; then
                  echo "    OK: $(basename "$f")"
                else
                  echo "    FAILED: $(basename "$f") — aborting deploy."
                  exit 1
                fi
              done
              echo "All SQL migrations applied successfully."
            else
              echo "No .sql migration files found in the image — skipping migrations."
            fi

            echo "==== 7b-2. RESTART THE APP ONTO THE MIGRATED SCHEMA ===="
            # The first boot may have died against the old schema. Now that the
            # columns exist, restart and require health: this is the gate that
            # decides whether the deploy succeeded, and a red X here is what
            # should have been shown instead of a 502 nobody was watching for.
            sudo docker compose up -d --force-recreate fastapi_backend

            APP_READY=0
            for i in $(seq 1 40); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
                APP_READY=1
                echo "Application is healthy on the migrated schema."
                break
              fi
              echo "  ...waiting for app ($i/40)"
              sleep 3
            done
            if [ "$APP_READY" -ne 1 ]; then
              echo "ERROR: the application is still unhealthy AFTER migrations."
              sudo docker compose logs --tail 80 fastapi_backend || true
              exit 1
            fi

            echo "==== 7c. POST-DEPLOY SMOKE TEST ===="
            # Migrations succeeding only proves the SQL ran. This proves the
            # deployed service actually works: the seeded admin can log in, the
            # analytics endpoints answer, and the figures they return are
            # non-zero and agree with each other. An empty database answers
            # every one of those requests with a cheerful 200 and a screen of
            # zeros — this is the check that tells the two apart.
            #
            # Runs inside the app container, against localhost, using only the
            # standard library, so it needs nothing installed on the host.
            SMOKE_EMAIL=$(grep -m1 '^SMOKE_ADMIN_EMAIL=' .env 2>/dev/null | cut -d '=' -f2- | cut -d '#' -f1 | tr -d '[:space:]' || true)
            SMOKE_EMAIL="${SMOKE_EMAIL:-superadmin@sribeesonline.lk}"
            SMOKE_PASSWORD=$(grep -m1 '^SMOKE_ADMIN_PASSWORD=' .env 2>/dev/null | cut -d '=' -f2- | cut -d '#' -f1 | tr -d '[:space:]' || true)
            SMOKE_PASSWORD="${SMOKE_PASSWORD:-Admin@123}"

            if sudo docker compose exec -T fastapi_backend \
                 python scripts/smoke_test.py \
                   --base-url http://127.0.0.1:8000 \
                   --email "$SMOKE_EMAIL" \
                   --password "$SMOKE_PASSWORD"; then
              echo "Smoke test passed."
            else
              echo "ERROR: post-deploy smoke test FAILED — the service is up but not working."
              sudo docker compose logs --tail 80 fastapi_backend || true
              exit 1
            fi

            echo "==== 8. NGINX REVERSE PROXY & SSL ===="
            NGINX_CONF="/etc/nginx/sites-available/sribees"

            echo "server {" | sudo tee "$NGINX_CONF" > /dev/null
            echo "    listen 80;" | sudo tee -a "$NGINX_CONF" > /dev/null
            echo "    server_name ${DOMAIN};" | sudo tee -a "$NGINX_CONF" > /dev/null
            echo "    client_max_body_size 25M;" | sudo tee -a "$NGINX_CONF" > /dev/null
            echo "" | sudo tee -a "$NGINX_CONF" > /dev/null
            echo "    location / {" | sudo tee -a "$NGINX_CONF" > /dev/null
            echo "        client_max_body_size 25M;" | sudo tee -a "$NGINX_CONF" > /dev/null
            echo "        proxy_pass http://127.0.0.1:8000;" | sudo tee -a "$NGINX_CONF" > /dev/null
            echo '        proxy_set_header Host $host;' | sudo tee -a "$NGINX_CONF" > /dev/null
            echo '        proxy_set_header X-Real-IP $remote_addr;' | sudo tee -a "$NGINX_CONF" > /dev/null
            echo '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' | sudo tee -a "$NGINX_CONF" > /dev/null
            echo '        proxy_set_header X-Forwarded-Proto $scheme;' | sudo tee -a "$NGINX_CONF" > /dev/null
            echo "        proxy_http_version 1.1;" | sudo tee -a "$NGINX_CONF" > /dev/null
            echo '        proxy_set_header Upgrade $http_upgrade;' | sudo tee -a "$NGINX_CONF" > /dev/null
            echo '        proxy_set_header Connection "upgrade";' | sudo tee -a "$NGINX_CONF" > /dev/null
            echo "        proxy_read_timeout 86400;" | sudo tee -a "$NGINX_CONF" > /dev/null
            echo "    }" | sudo tee -a "$NGINX_CONF" > /dev/null
            echo "}" | sudo tee -a "$NGINX_CONF" > /dev/null

            sudo ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
            sudo nginx -t

            echo "Requesting SSL for $DOMAIN..."
            sudo certbot --nginx -d "$DOMAIN" \
              --non-interactive --agree-tos -m "$EMAIL" \
              --redirect --keep-until-expiring 2>/dev/null || echo "SSL setup skipped (DNS may not be ready)"

            sudo systemctl restart nginx

            echo "==== 9. SSL AUTO-RENEWAL CRON ===="
            EXISTING_CRON=$(sudo crontab -l 2>/dev/null || true)
            if echo "$EXISTING_CRON" | grep -q "certbot renew"; then
              echo "SSL auto-renewal cron already exists."
            else
              (echo "$EXISTING_CRON"; echo "0 0 * * * certbot renew --post-hook 'systemctl reload nginx'") | sudo crontab -
              echo "SSL auto-renewal cron added!"
            fi

            echo ""
            echo "==== DEPLOYMENT COMPLETED SUCCESSFULLY ===="
            sudo docker compose ps
            echo ""
            echo "API: https://${DOMAIN}/health"
            echo "Docs: https://${DOMAIN}/docs"

  # From outside, the way a customer's phone reaches it: DNS, TLS, nginx and the
  # app together. The in-container smoke test above cannot see any of the first
  # three. Read-only: nothing here writes.
  verify-public:
    name: Verify through the public edge
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    env:
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'https://api.sribees.com' }}
    steps:
      - name: Health, TLS and security headers
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null "$PUBLIC_API_URL/health"; then break; fi
            [ "$i" = 10 ] && { echo "::error::$PUBLIC_API_URL/health is not answering"; exit 1; }
            sleep 6
          done
          headers=$(curl -fsS -D - -o /dev/null "$PUBLIC_API_URL/health")
          echo "$headers" | grep -qi '^strict-transport-security:' || { echo "::error::HSTS missing on the public edge"; exit 1; }
          echo "$headers" | grep -qi '^x-content-type-options: nosniff' || { echo "::error::nosniff missing"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_API_URL/docs")
          [ "$code" = "404" ] || { echo "::error::API docs are public ($code)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_API_URL/api/v1/admin/dashboard/stats")
          [ "$code" = "401" ] || { echo "::error::an admin route answered $code without a token"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_API_URL/api/v1/app/app-config")
          [ "$code" = "200" ] || { echo "::error::the app bootstrap config answered $code"; exit 1; }
          echo "public edge OK"
