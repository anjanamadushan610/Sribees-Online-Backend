name: Read-only SMTP diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure existing server access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config
      - name: Check production SMTP connection and authentication without sending email
        run: |
          ssh target 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          mapfile -t online < <(docker ps --filter label=com.docker.compose.project=sribees-online-prod --filter label=com.docker.compose.service=app --format '{{.ID}}')
          [ "${#online[@]}" -eq 1 ] || { echo "Expected one production app container"; exit 1; }
          docker exec -i "${online[0]}" python - <<'PYSMTP'
          import json
          import logging
          import smtplib
          import socket
          import ssl
          logging.disable(logging.CRITICAL)
          from loguru import logger
          logger.remove()
          from app.config.settings import settings
          def report(stage, **fields):
              print(json.dumps(dict(stage=stage, **fields)), flush=True)
          report('configuration', host=settings.mail_server, port=settings.mail_port,
                 implicit_tls=settings.mail_ssl_tls, starttls=settings.mail_starttls,
                 username_present=bool(settings.mail_username), password_present=bool(settings.mail_password),
                 sender_domain=settings.mail_from.partition('@')[2],
                 sender_matches_login=settings.mail_from.lower() == settings.mail_username.lower())
          smtp = None
          stage = 'dns'
          try:
              addresses = socket.getaddrinfo(settings.mail_server, settings.mail_port, type=socket.SOCK_STREAM)
              report(stage, ok=True, address_count=len(addresses))
              stage = 'smtp_connect'
              context = ssl.create_default_context()
              if settings.mail_ssl_tls:
                  smtp = smtplib.SMTP_SSL(settings.mail_server, settings.mail_port, timeout=10, context=context)
              else:
                  smtp = smtplib.SMTP(settings.mail_server, settings.mail_port, timeout=10)
              code, _ = smtp.ehlo()
              report(stage, ok=code == 250, smtp_code=code)
              if not settings.mail_ssl_tls and settings.mail_starttls:
                  stage = 'starttls'
                  code, _ = smtp.starttls(context=context)
                  report(stage, ok=code == 220, smtp_code=code)
                  smtp.ehlo()
              stage = 'authentication'
              code, _ = smtp.login(settings.mail_username, settings.mail_password)
              report(stage, ok=code in (235, 503), smtp_code=code)
              report('complete', email_sent=False)
          except Exception as error:
              report(stage, ok=False, error_type=type(error).__name__, smtp_code=getattr(error, 'smtp_code', None))
          finally:
              if smtp is not None:
                  smtp.close()
          PYSMTP
          REMOTE
