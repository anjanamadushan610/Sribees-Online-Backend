name: Read-only SMS configuration check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure existing server access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config
      - name: Inspect SMS configuration presence without sending messages
        run: |
          ssh target 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          mapfile -t online < <(docker ps --filter label=com.docker.compose.project=sribees-online-prod --filter label=com.docker.compose.service=app --format '{{.ID}}')
          [ "${#online[@]}" -eq 1 ] || { echo "Expected one production app container"; exit 1; }
          docker exec -i "${online[0]}" python - <<'PYCONFIG'
          import json
          import logging
          logging.disable(logging.CRITICAL)
          from loguru import logger
          logger.remove()
          from app.config.settings import settings
          from app.services.sms_gateway import get_sms_gateway, TextLkGateway
          gateway = get_sms_gateway()
          print(json.dumps({
              "sms_provider": settings.sms_provider,
              "real_sms_gateway_configured": isinstance(gateway, TextLkGateway),
              "api_token_present": bool((settings.textlk_api_token or '').strip()),
              "sender_id_present": bool((settings.textlk_sender_id or '').strip()),
          }))
          PYCONFIG
          REMOTE
