name: Read-only Partner rollout inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure existing server access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config
      - name: Read non-secret production Partner feature switches
        run: |
          ssh target 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          mapfile -t online < <(docker ps --filter label=com.docker.compose.project=sribees-online-prod --filter label=com.docker.compose.service=app --format '{{.ID}}')
          [ "${#online[@]}" -eq 1 ] || { echo "Expected one production app container"; exit 1; }
          docker exec "${online[0]}" python -c 'import os,json; print(json.dumps({key: os.getenv(key,"false").lower() == "true" for key in ["LINKED_PARTNER_WALLET_ENABLED","PARTNER_WALLET_FINANCE_READY","FINANCE_OUTBOX_ENABLED"]}))'
          mapfile -t finance < <(docker ps --filter label=com.docker.compose.project=sribees-finance-prod --filter label=com.docker.compose.service=api --format '{{.ID}}')
          echo "Production Finance API containers: ${#finance[@]}"
          echo "Production Finance worker status:"
          docker ps -a --filter label=com.docker.compose.project=sribees-finance-prod --filter label=com.docker.compose.service=worker --format '{{.Status}}'
          if [ "${#finance[@]}" -eq 1 ]; then
            docker exec "${finance[0]}" python -c 'import json,logging; logging.disable(logging.CRITICAL); from app.services.online_feed import HANDLERS; print(json.dumps({"finance_partner_handlers":sorted(k for k in HANDLERS if k.startswith("partner."))}))'
          fi
          mapfile -t workers < <(docker ps -a --filter label=com.docker.compose.project=sribees-finance-prod --filter label=com.docker.compose.service=worker --format '{{.ID}}')
          if [ "${#workers[@]}" -eq 1 ]; then
            docker inspect --format 'Worker OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} FinishedAt={{.State.FinishedAt}}' "${workers[0]}"
          fi
          if [ "${#finance[@]}" -eq 1 ]; then
            docker exec -i "${finance[0]}" python - <<'PYREAD'
          import asyncio
          import json
          import logging
          logging.disable(logging.CRITICAL)
          from sqlalchemy import text
          from app.core.db import get_engine
          async def inspect_readiness():
              engine = get_engine()
              async with engine.connect() as conn:
                  async with conn.begin():
                      await conn.execute(text("SET TRANSACTION READ ONLY"))
                      row = (await conn.execute(text("SELECT go_live_date, snapshot_seq IS NOT NULL AS snapshot_imported, stock_authority FROM go_live WHERE id=1"))).mappings().first()
                      print("Finance Go Live readiness", json.dumps(dict(row) if row else {}, default=str))
                      rows = (await conn.execute(text("SELECT status, count(*) AS entries FROM opening_entries GROUP BY status"))).mappings().all()
                      print("Finance opening entry statuses", json.dumps([dict(r) for r in rows]))
                      feed = (await conn.execute(text("SELECT last_seq, last_polled_at, last_error IS NOT NULL AS has_error FROM feed_state WHERE feed='online'"))).mappings().first()
                      print("Finance feed readiness", json.dumps(dict(feed) if feed else {}, default=str))
              await engine.dispose()
          asyncio.run(inspect_readiness())
          PYREAD
          fi
          REMOTE
