name: Wallet change rollout audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure existing SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo 'Host target'
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo '  IdentityFile ~/.ssh/id_deploy'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
          } > ~/.ssh/config
      - name: Verify worker heartbeat and Finance handler
        run: |
          ssh target 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          mapfile -t express < <(docker ps -q --filter label=com.docker.compose.project=sribees --filter label=com.docker.compose.service=app-1)
          test "${#express[@]}" = 1
          docker exec -i "${express[0]}" python - <<'PY'
          import asyncio
          import json
          import sys
          from datetime import UTC, datetime, timedelta
          from sqlalchemy import func, select
          from app.db import AsyncSessionLocal, engine
          from app.finance.models import WalletChangeAccount
          async def latest():
              async with AsyncSessionLocal() as session:
                  return await session.scalar(select(func.max(WalletChangeAccount.last_seen_at)))
          async def audit():
              before = await latest()
              after = before
              for _ in range(3):
                  await asyncio.sleep(15)
                  after = await latest()
                  if after is not None and (before is None or after > before):
                      break
              active = after is not None and after > datetime.now(UTC) - timedelta(minutes=2)
              advancing = after is not None and (before is None or after > before)
              print(json.dumps({'wallet_worker_heartbeat': 'ready' if active and advancing else 'failed',
                                'latest_heartbeat_utc': after.isoformat() if after else None}))
              await engine.dispose()
              if not (active and advancing):
                  raise RuntimeError('Wallet worker heartbeat is not advancing')
          try:
              asyncio.run(audit())
          except Exception as exc:
              print('wallet_heartbeat_audit_failed', type(exc).__name__)
              sys.exit(1)
          PY
          mapfile -t finance < <(docker ps -q --filter label=com.docker.compose.project=sribees-finance-prod --filter label=com.docker.compose.service=api)
          test "${#finance[@]}" = 1
          docker exec -i "${finance[0]}" python - <<'PY'
          from app.services.online_feed import WALLET_RULES
          if WALLET_RULES.get('rider_cash_change') != ('1210', '2100', 0):
              raise SystemExit('finance_wallet_change_handler_missing')
          print('finance_wallet_change_handler_ready')
          PY
          docker ps -a --filter label=com.docker.compose.project=sribees-finance-prod --filter label=com.docker.compose.service=worker --format 'finance_feed_worker={{.State}}'
          REMOTE
