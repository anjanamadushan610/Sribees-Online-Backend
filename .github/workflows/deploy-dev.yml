# =============================================================================
# SRIBEESonline — development CD (Contabo)
#
# Runs only when started by hand (workflow_dispatch) on `development`. Production is a different workflow
# (deploy-prod.yml), a different host, a different database and a
# different branch; nothing here can reach it.
#
# Build once, push it, deploy that exact digest. The image is referenced
# downstream by immutable digest and never by a floating tag, so what is
# deployed is bit-for-bit what was built from this commit — a `:latest` tag
# would let a concurrent build swap the bytes out between push and pull.
#
# Shares the Contabo box with sribees-express-dev, which owns the public edge:
# its Caddy already binds host ports 80 and 443, so this stack publishes one
# loopback port and that Caddy proxies the dev hostname to it. The site block
# to add there is in docs/DEV_ENVIRONMENT.md — until it exists the smoke test
# below fails, which is the correct way to find out.
#
# Required repository secrets (Settings → Secrets → Actions):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS   — the Contabo box
#   SSH_PORT                  — optional, defaults to 22
#   DEV_DEPLOY_PATH           — optional, defaults to /opt/sribees-online-dev
#   DEV_ENV_FILE              — the whole .env for the dev stack
#   DEV_SMS_PROVIDER, DEV_TEXTLK_API_TOKEN, DEV_TEXTLK_SENDER_ID
#                             — optional; override those keys of DEV_ENV_FILE
#   DEV_FINANCE_OUTBOX_ENABLED, DEV_FINANCE_SERVICE_TOKEN_SHA256
#                             — optional; Sribees Finance's event feed, same way
#   DEV_DOMAIN                — e.g. dev-api.sribees.com
# =============================================================================

name: Deploy Development (Contabo)

on:
  # Manual only (owner, 2026-09-28): a push starts nothing, because every run
  # on this private repo spends the free account's Actions minutes. Start it
  # from the Actions tab or the REST API (workflow_dispatch).
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Redeploy an existing image (ghcr.io/OWNER/REPO@sha256:...). Empty = build from this ref."
        required: false
        type: string
      reuse_existing_marx:
        description: "Owner-approved live Marx configuration for development. Payment methods remain disabled."
        required: false
        default: false
        type: boolean
      lookup_only:
        description: "Read the selected development customer/rider identities without deploying."
        required: false
        default: false
        type: boolean
      live_test_order:
        description: "Owner-approved unpaid COD order to enable for live card-at-delivery testing."
        required: false
        type: string
      live_test_customer:
        description: "Full development customer UUID owning the selected live test order."
        required: false
        type: string
      test_customer_code:
        description: "Customer profile code for a read-only lookup (SR followed by six characters)."
        required: false
        type: string
      test_rider_name:
        description: "Exact development rider name for the read-only lookup."
        required: false
        type: string

permissions:
  contents: read

# Queue rather than cancel: a half-finished rollout must always be driven to
# completion, and cancelling one mid-migration leaves the schema ahead of the
# running image.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # The same gate main gets. A hotfix pushed straight to development still has
  # to be green before it can reach a server anyone is testing against.
  # ---------------------------------------------------------------------------
  verify:
    name: CI gate
    if: ${{ inputs.image_ref == '' && !inputs.lookup_only }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Build and push. Output is a digest, not a tag.
  # ---------------------------------------------------------------------------
  build:
    name: Build & push image
    if: ${{ inputs.image_ref == '' && !inputs.lookup_only }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase, and a repository owner may legitimately have
      # capitals in their handle.
      - name: Resolve lowercase image name
        id: name
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}:dev
            ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev,ignore-error=true

      - name: Pin the image by digest
        id: digest
        run: |
          echo "image=${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Ship it.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Contabo
    needs: [build]
    # always() + an explicit result check so a manual redeploy (which skips
    # build) still runs, while a *failed* build never reaches the server.
    if: ${{ always() && !cancelled() && (inputs.lookup_only || needs.build.result == 'success' || inputs.image_ref != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Read, never write: this job hands its GITHUB_TOKEN to the server, and
      # the server's only job is to pull. Without this the token carries no
      # packages scope and the pull fails with a message that reads like a
      # visibility problem and is really a missing permission on our side.
      packages: read
    env:
      DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/sribees-online-dev' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image reference
        if: ${{ !inputs.lookup_only }}
        id: image
        env:
          BUILT: ${{ needs.build.outputs.image }}
          OVERRIDE: ${{ inputs.image_ref }}
        run: |
          IMAGE="${OVERRIDE:-$BUILT}"
          if [ -z "$IMAGE" ]; then
            echo "::error::no image reference to deploy"
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          # Pinning the host key is what stops a DNS or BGP hijack being handed
          # our deploy key and our .env. Never StrictHostKeyChecking=no.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  BatchMode yes"
            echo "  ServerAliveInterval 20"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh target "echo connected as \$(id -un) on \$(hostname)"

      - name: Inspect selected development test accounts
        if: ${{ inputs.lookup_only }}
        env:
          TEST_CUSTOMER_CODE: ${{ inputs.test_customer_code }}
          TEST_RIDER_NAME: ${{ inputs.test_rider_name }}
        run: |
          selection=$(python3 - <<'PY'
          import base64
          import json
          import os
          from scripts.inspect_delivery_card_test_accounts import validate_selection

          code, rider = validate_selection({"customer_code": os.environ["TEST_CUSTOMER_CODE"], "rider_name": os.environ["TEST_RIDER_NAME"]})
          print(base64.b64encode(json.dumps({"customer_code": code, "rider_name": rider}).encode()).decode())
          PY
          )
          online=$(ssh target "docker ps --filter label=com.docker.compose.project=sribees-online-dev --filter label=com.docker.compose.service=app --format '{{.ID}}'")
          express=$(ssh target 'cd /opt/sribees-express-dev && APP_IMAGE="$(cat .image)" docker compose -f docker-compose.deploy.yml ps -q app-1')
          [[ "$online" =~ ^[0-9a-f]{12,64}$ ]] && [[ "$express" =~ ^[0-9a-f]{12,64}$ ]] || {
            echo "::error::expected one Online and one Express development app container"
            exit 1
          }
          online_status=0
          rider_status=0
          ssh target "CARD_TEST_SELECTION_B64='$selection' docker exec -i -e CARD_TEST_SELECTION_B64 '$online' python - online" < scripts/inspect_delivery_card_test_accounts.py || online_status=$?
          ssh target "CARD_TEST_SELECTION_B64='$selection' docker exec -i -e CARD_TEST_SELECTION_B64 '$express' python - express" < scripts/inspect_delivery_card_test_accounts.py || rider_status=$?
          [ "$online_status" -eq 0 ] && [ "$rider_status" -eq 0 ]

      - name: Prepare the remote directory
        if: ${{ !inputs.lookup_only }}
        # /opt is root-owned and the deploy account has no sudo, by design. On
        # a fresh box `install -d` therefore fails and the deploy dies here.
        # Creating it by hand once is not an answer: the next rebuilt VPS
        # breaks the same way, and that runbook step is forgotten exactly when
        # someone is under pressure. The account IS in the docker group, which
        # is root-equivalent and is the accepted property of a compose deploy,
        # so a throwaway container is the sanctioned way to create the tree.
        # Idempotent: every run after the first takes the fast path.
        run: |
          ssh target "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          if install -d -m 0750 "$DEPLOY_PATH" "$DEPLOY_PATH/docker" "$DEPLOY_PATH/backups" 2>/dev/null; then
            echo "deploy tree ready at $DEPLOY_PATH (owned by $(id -un))"
            exit 0
          fi
          parent="$(dirname "$DEPLOY_PATH")"
          leaf="$(basename "$DEPLOY_PATH")"
          echo "creating $DEPLOY_PATH via a throwaway container ($(id -un) has no sudo)"
          docker run --rm -v "$parent:/mnt" alpine:3.20 sh -c "
            mkdir -p '/mnt/$leaf/docker' '/mnt/$leaf/backups' &&
            chown -R $(id -u):$(id -g) '/mnt/$leaf' &&
            chmod 0750 '/mnt/$leaf' '/mnt/$leaf/docker' '/mnt/$leaf/backups'"
          install -d -m 0750 "$DEPLOY_PATH" "$DEPLOY_PATH/docker" "$DEPLOY_PATH/backups"
          echo "deploy tree created at $DEPLOY_PATH (owned by $(id -un))"
          REMOTE

      - name: Sync deploy bundle
        if: ${{ !inputs.lookup_only }}
        run: |
          # Only what the server needs to RUN the stack. Application code is
          # never copied here; it arrives exclusively inside the image.
          scp docker-compose.dev-contabo.yml "target:$DEPLOY_PATH/docker-compose.dev-contabo.yml"
          scp scripts/deploy-dev.sh "target:$DEPLOY_PATH/deploy-dev.sh"
          ssh target "chmod 0750 '$DEPLOY_PATH/deploy-dev.sh'"

      - name: Require the latest development changes before gateway preparation
        if: ${{ inputs.reuse_existing_marx && !inputs.lookup_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          development_sha=$(python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/git/ref/heads/development"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]})
          with urllib.request.urlopen(request, timeout=20) as response:
              print(json.load(response)["object"]["sha"])
          PY
          )
          git merge-base --is-ancestor "$development_sha" HEAD || {
            echo "::error::include the latest development changes before deploying the gateway test"
            exit 1
          }

      - name: Refuse a gateway switch while development payments are in flight
        if: ${{ inputs.reuse_existing_marx && !inputs.lookup_only }}
        run: |
          ssh target 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          mapfile -t online < <(docker ps --filter label=com.docker.compose.project=sribees-online-dev --filter label=com.docker.compose.service=app --format '{{.ID}}')
          [ "${#online[@]}" -eq 1 ] || { echo "expected one development app container"; exit 1; }
          docker exec -i "${online[0]}" python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.config.settings import settings

          if settings.app_env != "development":
              raise SystemExit("gateway preparation requires development")
          if settings.marx_gateway_methods_enabled or getattr(settings, "delivery_card_payment_enabled", False):
              raise SystemExit("disable development payment methods before switching gateway configuration")

          async def check():
              engine = create_async_engine(settings.async_database_url)
              try:
                  async with engine.connect() as connection:
                      await connection.execute(text("SET TRANSACTION READ ONLY"))
                      pending = await connection.scalar(text(
                          "SELECT COUNT(*) FROM payment_attempts "
                          "WHERE gateway = 'marx' AND status IN ('started', 'pending')"
                      ))
                      if pending:
                          raise SystemExit("resolve open development Marx attempts before switching configuration")
                      print("No open development Marx payment attempts")
              finally:
                  await engine.dispose()

          asyncio.run(check())
          PY
          REMOTE

      - name: Install the environment file (0600, never echoed)
        if: ${{ !inputs.lookup_only }}
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
          REUSE_EXISTING_MARX: ${{ inputs.reuse_existing_marx }}
          LIVE_TEST_ORDER: ${{ inputs.live_test_order }}
          LIVE_TEST_CUSTOMER: ${{ inputs.live_test_customer }}
          MARX_IPG_API_KEY: ${{ inputs.reuse_existing_marx && secrets.MARX_IPG_API_KEY || '' }}
          MARX_IPG_BASE_URL: ${{ inputs.reuse_existing_marx && secrets.MARX_IPG_BASE_URL || '' }}
          MARX_IPG_RETURN_URL: ${{ inputs.reuse_existing_marx && secrets.MARX_IPG_RETURN_URL || '' }}
          SMS_PROVIDER: ${{ secrets.DEV_SMS_PROVIDER }}
          TEXTLK_API_TOKEN: ${{ secrets.DEV_TEXTLK_API_TOKEN }}
          TEXTLK_SENDER_ID: ${{ secrets.DEV_TEXTLK_SENDER_ID }}
          # Sign-in client IDs: the same apps sign in against dev and prod.
          GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID || 'com.sribeesonline.sribeesMobile' }}
          # Sign in with Apple key (revoke on account closure, AASA). The .p8
          # is escaped to one line below.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          # Same testers on both: these numbers sign in with the test code and
          # are never texted.
          OTP_TEST_PHONES: ${{ secrets.OTP_TEST_PHONES }}
          # Sribees Finance's event feed: switched on, and the SHA-256 of the
          # token the dev finance worker presents.
          FINANCE_OUTBOX_ENABLED: ${{ secrets.DEV_FINANCE_OUTBOX_ENABLED }}
          FINANCE_SERVICE_TOKEN_SHA256: ${{ secrets.DEV_FINANCE_SERVICE_TOKEN_SHA256 }}
        run: |
          if [ -z "$DEV_ENV_FILE" ]; then
            echo "::error::secret DEV_ENV_FILE is empty"
            exit 1
          fi
          if [ "$REUSE_EXISTING_MARX" = "true" ]; then
            [ "$DEPLOY_PATH" = "/opt/sribees-online-dev" ] || { echo "::error::live gateway preparation requires the development path"; exit 1; }
            python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          names = ("MARX_IPG_API_KEY", "MARX_IPG_BASE_URL", "MARX_IPG_RETURN_URL")
          for name in names:
              value = os.environ.get(name, "")
              if not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"{name} must be configured as one line")
          for name in names[1:]:
              parsed = urlsplit(os.environ[name])
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit(f"{name} must be an absolute HTTPS URL")
          PY
            export MARX_GATEWAY_METHODS_ENABLED=false
            export DELIVERY_CARD_PAYMENT_ENABLED=false
          fi
          if [ -n "$LIVE_TEST_ORDER" ] || [ -n "$LIVE_TEST_CUSTOMER" ]; then
            [ "$REUSE_EXISTING_MARX" = "true" ] || { echo "::error::live test requires approved existing Marx configuration"; exit 1; }
            python3 - <<'PY'
          import os
          import re
          from uuid import UUID

          if not re.fullmatch(r"FC-[0-9]{8}-[A-Z0-9]{6}", os.environ["LIVE_TEST_ORDER"]):
              raise SystemExit("invalid test order number")
          if str(UUID(os.environ["LIVE_TEST_CUSTOMER"])) != os.environ["LIVE_TEST_CUSTOMER"]:
              raise SystemExit("test customer must be a canonical UUID")
          PY
            export DELIVERY_CARD_TEST_ORDER="$LIVE_TEST_ORDER"
            export DELIVERY_CARD_TEST_CUSTOMER="$LIVE_TEST_CUSTOMER"
            export DELIVERY_CARD_PAYMENT_ENABLED=true
          fi
          # The SMS gateway keys live as their own secrets, so they can be set
          # or rotated without rebuilding DEV_ENV_FILE. Each set one replaces
          # the same key in it; nothing is echoed.
          for key in MARX_IPG_API_KEY MARX_IPG_BASE_URL MARX_IPG_RETURN_URL MARX_GATEWAY_METHODS_ENABLED DELIVERY_CARD_PAYMENT_ENABLED DELIVERY_CARD_TEST_ORDER DELIVERY_CARD_TEST_CUSTOMER SMS_PROVIDER TEXTLK_API_TOKEN TEXTLK_SENDER_ID GOOGLE_CLIENT_IDS APPLE_SERVICES_ID APPLE_BUNDLE_ID APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY OTP_TEST_PHONES FINANCE_OUTBOX_ENABLED FINANCE_SERVICE_TOKEN_SHA256; do
            value=$(printenv "$key" || true)
            if [ "$key" = "APPLE_PRIVATE_KEY" ] && [ -n "$value" ]; then
              # A .p8 spans lines; the .env wants one. Settings unescape it.
              value=$(printf '%s' "$value" | tr -d '\r' | awk 'BEGIN { ORS = "\\n" } { print }')
            fi
            if [ -n "$value" ]; then
              DEV_ENV_FILE=$(printf '%s\n' "$DEV_ENV_FILE" | grep -v "^${key}=" || true)
              DEV_ENV_FILE=$(printf '%s\n%s=%s' "$DEV_ENV_FILE" "$key" "$value")
            fi
          done
          # Piped over the SSH channel and written under umask 077 — the value
          # never lands in a log, in a process argv, or in a world-readable
          # temp file. Written to .new and moved so a failed transfer cannot
          # leave a truncated .env behind.
          printf '%s\n' "$DEV_ENV_FILE" | ssh target \
            "umask 077 && cat > '$DEPLOY_PATH/.env.new' && chmod 600 '$DEPLOY_PATH/.env.new' && mv '$DEPLOY_PATH/.env.new' '$DEPLOY_PATH/.env'"

      - name: Registry login on the server (short-lived job token)
        if: ${{ !inputs.lookup_only }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh target \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Roll out
        if: ${{ !inputs.lookup_only }}
        id: rollout
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          ssh target "cd '$DEPLOY_PATH' && APP_IMAGE='$IMAGE' ./deploy-dev.sh deploy"

      - name: Report development payment readiness without secrets
        if: ${{ !inputs.lookup_only }}
        env:
          EXPECTED_RETURN_URL: ${{ inputs.reuse_existing_marx && secrets.MARX_IPG_RETURN_URL || '' }}
          EXPECTED_TEST_ORDER: ${{ inputs.live_test_order }}
          EXPECTED_TEST_CUSTOMER: ${{ inputs.live_test_customer }}
        run: |
          expected_return_hash=""
          if [ -n "$EXPECTED_RETURN_URL" ]; then
            expected_return_hash=$(printf '%s' "$EXPECTED_RETURN_URL" | sha256sum | awk '{print $1}')
          fi
          selection=$(python3 -c 'import base64,json,os; print(base64.b64encode(json.dumps([os.environ["EXPECTED_TEST_ORDER"],os.environ["EXPECTED_TEST_CUSTOMER"]]).encode()).decode())')
          ssh target "EXPECTED_RETURN_SHA256='$expected_return_hash' EXPECTED_TEST_SELECTION='$selection' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          mapfile -t online < <(docker ps --filter label=com.docker.compose.project=sribees-online-dev --filter label=com.docker.compose.service=app --format '{{.ID}}')
          [ "${#online[@]}" -eq 1 ] || { echo "expected one development app container"; exit 1; }
          docker exec -i -e EXPECTED_RETURN_SHA256 -e EXPECTED_TEST_SELECTION "${online[0]}" python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from urllib.parse import urlsplit
          from app.config.settings import settings

          if settings.app_env != "development":
              raise SystemExit("payment readiness check requires development")
          expected_hash = os.environ.get("EXPECTED_RETURN_SHA256", "")
          test_order, test_customer = json.loads(base64.b64decode(os.environ["EXPECTED_TEST_SELECTION"]))
          matches_existing = None
          if expected_hash:
              matches_existing = hashlib.sha256(settings.marx_ipg_return_url.encode()).hexdigest() == expected_hash
              if not matches_existing:
                  raise SystemExit("configured Return URL differs from the existing approved URL")
              if settings.marx_gateway_methods_enabled:
                  raise SystemExit("general checkout payment methods must remain disabled")
              if settings.delivery_card_payment_enabled != bool(test_order and test_customer):
                  raise SystemExit("delivery card activation differs from the selected test")
              if test_order and (settings.delivery_card_test_order != test_order or settings.delivery_card_test_customer != test_customer):
                  raise SystemExit("delivery card test scope differs from the approved selection")
          print(json.dumps({
              "environment": settings.app_env,
              "delivery_card_enabled": settings.delivery_card_payment_enabled,
              "gateway_methods_enabled": settings.marx_gateway_methods_enabled,
              "gateway_hostname": urlsplit(settings.marx_ipg_base_url).hostname,
              "return_hostname": urlsplit(settings.marx_ipg_return_url).hostname,
              "gateway_key_configured": bool(settings.marx_ipg_api_key),
              "return_url_matches_existing": matches_existing,
              "selected_test_order": test_order or None,
          }))
          PY
          REMOTE

      - name: Smoke test through the public edge
        if: ${{ !inputs.lookup_only }}
        env:
          DOMAIN: ${{ secrets.DEV_DOMAIN }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "https://$DOMAIN/health" || true)
            if [ "$code" = "200" ]; then
              echo "health OK through https://$DOMAIN"
              exit 0
            fi
            echo "attempt $i: got '$code', retrying"
            sleep 6
          done
          echo "::error::/health never returned 200 through https://$DOMAIN"
          exit 1

      - name: Roll back on failure
        if: ${{ failure() && (steps.rollout.outcome == 'success' || steps.rollout.outcome == 'failure') }}
        run: |
          ssh target "cd '$DEPLOY_PATH' && ./deploy-dev.sh rollback" \
            || echo "::warning::automatic rollback failed - investigate on the host"

      - name: Drop the registry credential from the server
        if: ${{ always() && !inputs.lookup_only }}
        run: ssh target "docker logout ghcr.io" || true
